<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8' />
    <title>Hospital Schedule | Calendar</title>

    <link rel="stylesheet" th:href="@{/webjars/fullcalendar/2.2.5/fullcalendar.css}" />
    <link rel="stylesheet" th:href="@{/webjars/fullcalendar/2.2.5/fullcalendar.print.css}" media="print" />

    <script th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/momentjs/2.9.0/min/moment.min.js}"></script>
    <script th:src="@{/webjars/fullcalendar/2.2.5/fullcalendar.min.js}"></script>

    <script th:inline="javascript">
        $(document).ready(function() {
            $('#calendar').fullCalendar({
                header: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'month,agendaWeek,agendaDay'
                },
                // Updated to match your current system year
                defaultDate: '2026-04-01',
                editable: true,
                eventLimit: true,
                events: {
                    /* Matches the mapping in your controller that returns the JSON list of events */
                    url: /*[[@{/receptionist/jsonEvents}]]*/ '/receptionist/jsonEvents',
                    type: 'GET',
                    error: function() {
                        console.log('Error fetching calendar events.');
                    }
                }
            });
        });
    </script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Inter", Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }
        .header-title {
            text-align: center;
            color: #1e40af;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
        }
        #calendar {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
<h1 class="header-title">Hospital Schedule Terminal</h1>
<hr style="border: 1px solid #e2e8f0; margin-bottom: 30px;">

<div id='calendar'></div>
</body>
</html>
