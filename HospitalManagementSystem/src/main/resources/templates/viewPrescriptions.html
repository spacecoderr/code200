<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Records | HMS Patient Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .print-card {
                border: 1px solid #e2e8f0 !important;
                break-inside: avoid;
                border-radius: 1rem !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 md:px-8">

<div class="max-w-5xl mx-auto">
    <nav class="bg-white rounded-2xl border border-slate-100 px-6 py-4 flex justify-between items-center no-print sticky top-4 z-50 shadow-lg shadow-slate-200/20 mb-12">
        <div class="flex items-center gap-4">
            <a th:href="@{/appointments/myAppointments}" class="text-slate-400 hover:text-blue-600 transition p-2 rounded-xl hover:bg-slate-50">
                <i class="fas fa-chevron-left"></i>
            </a>
            <h1 class="text-lg font-black text-slate-800 tracking-tighter uppercase">My <span class="text-blue-600">Records</span></h1>
        </div>
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition flex items-center gap-2">
            <i class="fas fa-print"></i> Print Terminal
        </button>
    </nav>

    <header class="mb-8 no-print px-2">
        <h2 class="text-2xl font-black text-slate-800 tracking-tighter uppercase">Clinical History</h2>
        <p class="text-slate-500 text-sm font-medium">Digital copies of your issued prescriptions.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div th:each="p : ${prescriptions}" class="bg-white rounded-3xl shadow-xl shadow-slate-200/40 border border-slate-100 overflow-hidden print-card hover:border-blue-200 transition-all duration-300 flex flex-col">

            <div class="px-6 py-4 bg-slate-50/50 border-b border-slate-100 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center text-[10px] shadow-lg shadow-blue-100">
                        <i class="fas fa-id-card"></i>
                    </div>
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest" th:text="'#APT-' + ${p.appointment_id}">#001</span>
                </div>
                <span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md border border-emerald-100 uppercase tracking-tighter">
                    <i class="fas fa-check mr-1"></i> Verified
                </span>
            </div>

            <div class="p-6 flex-grow">
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-slate-50">
                    <div>
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-0.5">Physician</p>
                        <p class="text-sm font-black text-slate-800" th:text="${p.doctorName}">Dr. Bijoy</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-0.5">Issued On</p>
                        <p class="text-xs font-bold text-slate-600" th:text="${p.date}">2026-04-07</p>
                    </div>
                </div>

                <div class="bg-blue-50/20 rounded-2xl p-5 border border-blue-100/50 relative overflow-hidden group">
                    <div class="absolute -right-2 -bottom-2 opacity-5 text-blue-900 group-hover:opacity-10 transition-opacity">
                        <i class="fas fa-prescription fa-4x"></i>
                    </div>

                    <label class="block text-[9px] font-black text-blue-500 uppercase mb-3 tracking-[0.2em] flex items-center gap-2">
                        <i class="fas fa-notes-medical"></i> Medical Advice
                    </label>

                    <p class="text-slate-700 leading-relaxed font-bold text-sm italic relative z-10 whitespace-pre-line" th:text="${p.prescription}">
                        Dosage and advice...
                    </p>
                </div>
            </div>

            <div class="px-6 py-3 bg-slate-50/30 border-t border-slate-50 text-[8px] font-black text-slate-300 uppercase tracking-[0.4em] flex justify-between">
                <span>HMS Terminal Node</span>
                <span>Encrypted EHR</span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(prescriptions)}" class="col-span-full py-24 text-center bg-white rounded-[2rem] border-2 border-dashed border-slate-200">
            <div class="h-16 w-16 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-6 text-slate-200 shadow-inner">
                <i class="fas fa-folder-open fa-2x"></i>
            </div>
            <h3 class="text-slate-800 font-black text-xl tracking-tight uppercase">Terminal Empty</h3>
            <p class="text-slate-400 font-medium text-sm mt-2">No clinical records found in your profile.</p>
        </div>
    </div>
    </main>

    <footer class="mt-12 py-10 text-center no-print">
        <p class="text-[9px] font-black text-slate-300 uppercase tracking-[0.6em] border-t border-slate-200 pt-8 inline-block px-12">
            Hospital Intelligence System &bull; 2026
        </p>
    </footer>

</body>
</html>
