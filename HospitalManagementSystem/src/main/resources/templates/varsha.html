<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Prescription | HMS Doctor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center py-12 px-4">

<div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-2xl border border-slate-100">

    <div class="flex items-center justify-between mb-8 pb-6 border-b border-slate-100">
        <div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tighter uppercase">Issue Prescription</h1>
            <p class="text-slate-400 font-medium text-sm">Update clinical notes for this patient session.</p>
        </div>
        <div class="text-blue-600 bg-blue-50 h-14 w-14 rounded-2xl flex items-center justify-center text-2xl shadow-inner">
            <i class="fas fa-file-medical"></i>
        </div>
    </div>

    <form th:action="@{/doctors/savePrescription}" method="post" class="space-y-6">

        <input type="hidden" name="appointment_id" th:value="${prescription.appointment_id}" />

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1 tracking-[0.2em]">Appointment Ref</label>
                <input type="text" th:value="${'#APT-' + prescription.appointment_id}" readonly
                       class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-slate-400 font-black outline-none cursor-not-allowed">
            </div>
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1 tracking-[0.2em]">Patient Name</label>
                <input type="text" th:value="${prescription.patientName}" readonly
                       class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-slate-700 font-bold outline-none cursor-not-allowed">
            </div>
        </div>

        <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1 tracking-[0.2em]">Medical Instructions (Rx)</label>

            <textarea name="prescription" required
                      rows="8"
                      class="w-full px-6 py-5 bg-white border-2 border-slate-100 rounded-[1.5rem] focus:border-blue-400 focus:ring-4 focus:ring-blue-50 outline-none transition font-medium text-slate-700 leading-relaxed shadow-sm"
                      placeholder="Enter symptoms, diagnosis, and medication dosage..."
                      th:text="${prescription.prescription == 'yes' ? '' : prescription.prescription}"></textarea>

            <p class="mt-3 text-[10px] text-slate-300 font-bold uppercase tracking-widest px-2">
                <i class="fas fa-info-circle mr-1"></i> This record will be instantly available to the patient.
            </p>
        </div>

        <div class="pt-6 flex items-center justify-between gap-4">
            <a th:href="@{/doctors/doctorAppointments}"
               class="text-xs font-black text-slate-300 hover:text-red-500 transition uppercase tracking-widest flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Discard Changes
            </a>
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase tracking-widest py-4 px-10 rounded-2xl shadow-xl shadow-blue-100 transition-all active:scale-95 flex items-center gap-3">
                <i class="fas fa-check-circle text-lg"></i> Complete Consultation
            </button>
        </div>
    </form>
</div>

<div class="mt-8 text-center no-print">
    <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.5em]">HMS Secure Terminal &bull; 2026</p>
</div>

</body>
</html>
