<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Hospital Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .rainbow-bar {
            height: 6px;
            background: linear-gradient(to right, #c4e17f, #f7fdca, #fecf71, #f0776c, #db9dbe, #c49cde, #669ae1, #62c2e4);
        }
    </style>
</head>
<body class="bg-slate-700 min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden relative">
    <div class="rainbow-bar"></div>

    <div class="p-10">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-light text-slate-400 italic">Sign up in seconds</h1>
            <p class="text-slate-500 mt-2 font-medium">Join the Hospital Management network</p>
        </header>

        <form th:action="@{/signup}" th:object="${user}" method="post" class="space-y-5">

            <input type="hidden" name="role" value="PATIENT" />

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1 tracking-wider">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-300">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" th:field="*{username}"
                           class="w-full pl-10 pr-4 py-3 bg-white border-2 border-slate-100 rounded-xl focus:border-blue-400 focus:ring-0 outline-none transition"
                           placeholder="Choose a username" required autofocus>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1 tracking-wider">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-300">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" th:field="*{password}"
                           class="w-full pl-10 pr-4 py-3 bg-white border-2 border-slate-100 rounded-xl focus:border-blue-400 focus:ring-0 outline-none transition"
                           placeholder="Create a password" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1 tracking-wider">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-300">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" th:field="*{email}"
                           class="w-full pl-10 pr-4 py-3 bg-white border-2 border-slate-100 rounded-xl focus:border-blue-400 focus:ring-0 outline-none transition"
                           placeholder="you@example.com" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1 tracking-wider">Phone Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-300">
                        <i class="fas fa-phone"></i>
                    </span>
                    <input type="text" th:field="*{phone}"
                           class="w-full pl-10 pr-4 py-3 bg-white border-2 border-slate-100 rounded-xl focus:border-blue-400 focus:ring-0 outline-none transition"
                           placeholder="+1 (555) 000-0000">
                </div>
            </div>

            <div class="pt-6">
                <button type="submit"
                        class="w-full bg-[#f0776c] hover:bg-[#d76b60] text-white font-black py-4 rounded-xl shadow-lg shadow-red-100 transition-all active:scale-[0.96] uppercase tracking-widest text-sm">
                    Create My Account
                </button>
            </div>

            <div class="text-center mt-8">
                <p class="text-xs text-slate-400 font-semibold uppercase tracking-tighter">
                    Already part of the system?
                    <a th:href="@{/login}" class="text-blue-500 hover:text-blue-600 transition ml-1">Log in here</a>
                </p>
            </div>
        </form>
    </div>
</div>

<footer class="absolute bottom-6 text-slate-500 text-[10px] uppercase tracking-[0.3em]">
    Hospital Management &bull; Secure Registration
</footer>

</body>
</html>
