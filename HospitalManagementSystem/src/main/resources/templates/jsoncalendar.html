<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8' />
    <title>Interactive Schedule | HMS</title>

    <link rel="stylesheet" th:href="@{/webjars/fullcalendar/2.2.5/fullcalendar.css}" />
    <link rel="stylesheet" th:href="@{/webjars/fullcalendar/2.2.5/fullcalendar.print.css}" media="print" />
    <link rel="stylesheet" th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.css}" />

    <script th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/momentjs/2.9.0/min/moment.min.js}"></script>
    <script th:src="@{/webjars/fullcalendar/2.2.5/fullcalendar.min.js}"></script>
    <script th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.js}"></script>

    <script th:inline="javascript">
        $(function() {
            var dialog, editDialog, form;

            function validateDateRange(start, end) {
                if(!start.isValid() || !end.isValid()) {
                   alert("Invalid date format");
                   return false;
                }
                if(start.isSameOrAfter(end)) {
                  alert("End date must be strictly after start date");
                  return false;
                }
                return true;
            }

            function removeEvent() {
                if ($("#moduid").val()) {
                    $.ajax({
                        type: "DELETE",
                        url: "/event/" + $("#moduid").val(), // RESTful ID path
                        success: function() {
                            $('#calendar').fullCalendar('refetchEvents');
                            editDialog.dialog("close");
                        }
                    });
                }
                return true;
            }

            function editEvent(event) {
                $("#modtitle").val(event.title);
                $("#moddescription").val(event.description || "");
                $("#modstartdateandtime").val(moment(event.start).format("YYYY-MM-DDTHH:mm"));
                $("#modenddateandtime").val(moment(event.end).format("YYYY-MM-DDTHH:mm"));
                $("#moduid").val(event.id);
                editDialog.dialog("open");
            }

            function saveEvent() {
                var eventStart = moment($("#modstartdateandtime").val());
                var eventEnd = moment($("#modenddateandtime").val());

                if (validateDateRange(eventStart, eventEnd)) {
                    var eventData = {
                        id: $("#moduid").val(),
                        title: $("#modtitle").val(),
                        start: eventStart.toISOString(),
                        finish: eventEnd.toISOString(),
                        description: $("#moddescription").val()
                    };

                    $.ajax({
                        type: "PATCH",
                        url: "/event",
                        data: JSON.stringify(eventData),
                        contentType: "application/json",
                        success: function() {
                            $('#calendar').fullCalendar('refetchEvents');
                            editDialog.dialog("close");
                        }
                    });
                }
            }

            function addEvent() {
                var eventStart = moment($("#startdateandtime").val());
                var eventEnd = moment($("#enddateandtime").val());

                if (validateDateRange(eventStart, eventEnd)) {
                    var eventData = {
                        title: $("#newtitle").val(),
                        description: $("#description").val(),
                        start: eventStart.toISOString(),
                        finish: eventEnd.toISOString()
                    };

                    $.ajax({
                        type: "POST",
                        url: "/event",
                        data: JSON.stringify(eventData),
                        contentType: "application/json",
                        success: function(data) {
                            $('#calendar').fullCalendar('renderEvent', data, true);
                            dialog.dialog("close");
                        }
                    });
                }
            }

            dialog = $("#dialog-form").dialog({
                autoOpen: false, height: 400, width: 350, modal: true,
                buttons: { "Create": addEvent, Cancel: function() { dialog.dialog("close"); } }
            });

            editDialog = $("#edit-dialog-form").dialog({
                autoOpen: false, height: 400, width: 350, modal: true,
                buttons: { "Save": saveEvent, "Delete": removeEvent, Cancel: function() { editDialog.dialog("close"); } }
            });

            $('#calendar').fullCalendar({
                header: { left: 'prev,next today', center: 'title', right: 'month,agendaWeek,agendaDay' },
                defaultDate: moment().format("YYYY-MM-DD"),
                editable: true,
                selectable: true,
                events: '/receptionist/jsonEvents', // Mapping from receptionistController
                select: function(start, end) {
                    $("#startdateandtime").val(moment(start).format("YYYY-MM-DDTHH:mm"));
                    $("#enddateandtime").val(moment(end).format("YYYY-MM-DDTHH:mm"));
                    dialog.dialog("open");
                },
                eventClick: function(event) { editEvent(event); }
            });
        });
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; font-size: 14px; }
        #calendar { max-width: 900px; margin: 40px auto; background: white; padding: 20px; border-radius: 12px; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        label { display:block; font-weight: bold; margin-top: 10px; }
        input.text { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .ui-dialog-titlebar { background: #2563eb; color: white; border: none; }
    </style>
</head>
<body>
<div style="text-align: center; padding: 20px;">
    <h1 style="color: #1e40af; font-weight: 800;">RECEPTIONIST SCHEDULING TERMINAL</h1>
    <a th:href="@{/receptionist}" style="text-decoration: none; color: #64748b; font-weight: 600;">&larr; Back to Dashboard</a>
</div>

<div id='calendar'></div>

<div id="dialog-form" title="New Appointment Slot">
    <form>
        <label>Title</label>
        <input type="text" id="newtitle" class="text ui-widget-content ui-corner-all">
        <label>Description</label>
        <input type="text" id="description" class="text ui-widget-content ui-corner-all">
        <label>Starts</label>
        <input type="datetime-local" id="startdateandtime">
        <label>Ends</label>
        <input type="datetime-local" id="enddateandtime">
    </form>
</div>

<div id="edit-dialog-form" title="Modify Appointment">
    <form>
        <label>Title</label>
        <input type="text" id="modtitle" class="text ui-widget-content ui-corner-all">
        <label>Description</label>
        <input type="text" id="moddescription" class="text ui-widget-content ui-corner-all">
        <label>Starts</label>
        <input type="datetime-local" id="modstartdateandtime">
        <label>Ends</label>
        <input type="datetime-local" id="modenddateandtime">
        <input type="hidden" id="moduid">
    </form>
</div>
</body>
</html>
