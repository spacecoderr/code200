<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Invoice | HMS Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center py-12 px-4">

<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-2xl border border-slate-200">
    <div class="flex items-center justify-between mb-8 pb-6 border-b border-slate-100">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Generate Invoice</h1>
            <p class="text-slate-500 text-sm">Create a billing record for the completed consultation.</p>
        </div>
        <div class="text-blue-600 bg-blue-50 h-12 w-12 rounded-2xl flex items-center justify-center text-xl">
            <i class="fas fa-file-invoice-dollar"></i>
        </div>
    </div>

    <form th:action="@{/saveInvoice}" th:object="${invoice}" method="post" id="invoiceForm" class="space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Appointment ID</label>
                <input type="number" th:field="*{appointmentID}" required readonly
                       class="w-full px-4 py-3 bg-slate-100 border-2 border-slate-100 rounded-xl text-slate-500 cursor-not-allowed outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Patient Name</label>
                <input type="text" th:field="*{patientName}" required readonly
                       class="w-full px-4 py-3 bg-slate-100 border-2 border-slate-100 rounded-xl text-slate-500 cursor-not-allowed outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Billing Details & Breakdown</label>
            <textarea th:field="*{invoiceDetails}" required
                      rows="8"
                      class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-400 focus:ring-0 outline-none transition font-mono text-sm"
                      placeholder="Enter consultation fees, laboratory tests, and medicine costs..."></textarea>
        </div>

        <div class="pt-4 flex items-center justify-between gap-4">
            <a th:href="@{/receptionist/receptionistAppointments}"
               class="text-sm font-semibold text-slate-400 hover:text-slate-600 transition">
                <i class="fas fa-arrow-left mr-1"></i> Return to List
            </a>
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-xl shadow-lg shadow-blue-100 transition-all active:scale-95 flex items-center gap-2">
                <i class="fas fa-save"></i> Save & Generate
            </button>
        </div>
    </form>
</div>

</body>
</html>
