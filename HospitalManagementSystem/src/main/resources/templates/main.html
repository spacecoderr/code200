<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

<nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2 text-blue-600 font-black text-2xl tracking-tighter">
        <i class="fas fa-hospital-symbol"></i>
        <span>HOSPITAL SERVICE</span>
    </div>
    <div class="text-slate-300 text-[10px] font-bold uppercase tracking-[0.3em]">Portal v2.5</div>
</nav>

<main class="flex-grow flex items-center justify-center py-12 px-6">
    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">

        <div class="text-center lg:text-left">
            <h1 class="text-6xl md:text-8xl font-black text-slate-800 leading-none tracking-tighter mb-4">
                Hospital <br> <span class="text-blue-600">Management</span> <br> System.
            </h1>
            <p class="text-2xl text-slate-400 font-medium tracking-tight">
                A One-Stop Solution.
            </p>
        </div>

        <div class="flex flex-col gap-6">

            <a th:href="@{/login}" class="group relative bg-white p-10 rounded-[3rem] border-2 border-slate-100 hover:border-blue-500 shadow-xl shadow-blue-900/5 transition-all duration-500">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-4xl font-black text-slate-800 tracking-tight">System Login</h2>
                        <p class="text-slate-400 font-bold mt-1 uppercase text-xs tracking-widest">Registered Users</p>
                    </div>
                    <div class="h-20 w-20 bg-blue-600 text-white rounded-3xl flex items-center justify-center text-3xl group-hover:rotate-12 transition-transform shadow-lg shadow-blue-200">
                        <i class="fas fa-sign-in-alt"></i>
                    </div>
                </div>
            </a>

            <a th:href="@{/signup}" class="group relative bg-slate-900 p-10 rounded-[3rem] border-2 border-transparent hover:border-emerald-400 shadow-2xl transition-all duration-500">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-4xl font-black text-white tracking-tight">New Patient?</h2>
                        <p class="text-slate-500 font-bold mt-1 uppercase text-xs tracking-widest">Create Account</p>
                    </div>
                    <div class="h-20 w-20 bg-emerald-500 text-white rounded-3xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform shadow-lg shadow-emerald-900/40">
                        <i class="fas fa-user-plus"></i>
                    </div>
                </div>
            </a>

        </div>

    </div>
</main>

<footer class="py-10 text-center text-slate-300 text-[10px] uppercase tracking-[0.5em] font-bold">
    &copy; 2026 Hospital Management System
</footer>

</body>
</html>
