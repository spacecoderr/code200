<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Appointment | Hospital Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

<header class="bg-white shadow-sm py-6">
    <h1 class="text-center text-3xl font-bold text-blue-600 uppercase tracking-widest flex items-center justify-center gap-3">
        <i class="fas fa-hospital-symbol"></i> Hospital Management System
    </h1>
</header>

<main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-lg border border-slate-100">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">Schedule a Visit</h2>
            <p class="text-slate-500 mt-2">Enter the appointment details below.</p>
        </div>

        <form th:action="@{/appointments/save}" th:object="${appointment}" method="post" class="space-y-5">

            <input type="hidden" th:field="*{confirmed}" />

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Patient Name</label>
                <input type="text" th:field="*{patientName}" required
                       class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-400 focus:ring-0 outline-none transition"
                       placeholder="Full name of patient">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Doctor Name</label>
                <input type="text" th:field="*{doctorName}" required
                       class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-400 focus:ring-0 outline-none transition"
                       placeholder="e.g. Dr. Strange">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Appointment Date</label>
                <input type="date" th:field="*{date}" required
                       class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-400 focus:ring-0 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Prescription Required?</label>
                <select th:field="*{prescription}"
                        class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-blue-400 focus:ring-0 outline-none transition appearance-none">
                    <option value="yes">Yes (Initial Consultation)</option>
                    <option value="no">No (Follow-up)</option>
                </select>
            </div>

            <div class="pt-6">
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-100 transition-all active:scale-95">
                    <i class="fas fa-check-circle mr-2"></i> Confirm Appointment
                </button>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/appointments/myAppointments}" class="text-sm font-semibold text-slate-400 hover:text-red-500 transition">
                    <i class="fas fa-times mr-1"></i> Cancel and go back
                </a>
            </div>
        </form>
    </div>
</main>

<footer class="py-8 text-center text-slate-400 text-xs">
    &copy; 2026 Hospital Management System &bull; Secure Booking Terminal
</footer>

</body>
</html>
