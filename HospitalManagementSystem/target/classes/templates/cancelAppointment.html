<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Appointment | Hospital Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center py-12">

<div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-slate-200">
    <div class="text-center mb-8">
        <div class="h-16 w-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fas fa-calendar-times"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">Cancel Appointment</h1>
        <p class="text-slate-500 mt-2">Please enter the ID to confirm cancellation.</p>
    </div>

    <form th:action="@{/cancel}" th:object="${appointment}" method="post" class="space-y-6">

        <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg mb-6">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-triangle text-red-500"></i>
                </div>
                <div class="ml-3">
                    <p class="text-xs font-bold text-red-800 uppercase tracking-wide">Warning</p>
                    <p class="text-sm text-red-700 font-medium">This action cannot be undone!</p>
                </div>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Appointment ID</label>
            <input type="number" th:field="*{appointment_id}" required
                   class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-red-400 focus:ring-0 outline-none transition"
                   placeholder="e.g. 1024">
        </div>

        <div class="pt-4 flex gap-3">
            <a th:href="@{/appointments/myAppointments}"
               class="flex-1 text-center bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 rounded-xl transition">
                Go Back
            </a>
            <button type="submit"
                    class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-red-100 transition-all active:scale-95">
                Confirm Cancel
            </button>
        </div>
    </form>
</div>

<footer class="mt-8 text-slate-400 text-xs">
    &copy; 2026 Hospital Management System &bull; Secure Deletion Terminal
</footer>

</body>
</html>
